<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy-950: #060d1a;
    --navy-900: #0d1a30;
    --navy-800: #142748;
    --navy-700: #1e3a63;
    --gold-300: #f4d374;
    --gold-500: #c8a84b;
    --emerald: #34d399;
    --coral: #ff6b5e;
    --amber: #fbbf24;
    --text-muted: rgba(255,255,255,0.55);
  }
  body {
    background: radial-gradient(ellipse at top, var(--navy-800), var(--navy-950));
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; color: var(--gold-300); }
  .subtitle { color: var(--text-muted); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 24px; }

  .top-stats {
    background: linear-gradient(135deg, var(--navy-700), var(--navy-800));
    border: 1px solid rgba(200,168,75,0.3);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    text-align: center;
  }
  .top-stats > div {
    padding: 8px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .top-stats > div:last-child { border-right: 0; }
  .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  .stat-value { font-weight: 800; font-size: 26px; letter-spacing: -0.5px; }
  .stat-value.owed { color: var(--coral); }
  .stat-value.paid { color: var(--emerald); }
  .stat-value.people { color: var(--gold-300); }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .filter-btn.active {
    background: rgba(200,168,75,0.15);
    border-color: var(--gold-500);
    color: var(--gold-300);
  }
  .filter-btn:hover { border-color: var(--gold-500); }

  .staff-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .staff-card.all-paid { opacity: 0.55; }
  .staff-card.all-paid .staff-header { background: rgba(52,211,153,0.05); }
  .staff-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    gap: 12px;
    background: rgba(0,0,0,0.15);
  }
  .staff-header:hover { background: rgba(200,168,75,0.05); }
  .staff-name-block { display: flex; align-items: center; gap: 12px; flex: 1; }
  .staff-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .staff-name { font-weight: 700; font-size: 15px; }
  .staff-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .staff-owed {
    font-weight: 800; font-size: 18px;
    color: var(--coral);
  }
  .staff-owed.zero { color: var(--emerald); font-size: 15px; }

  .staff-card.expanded .expand-icon { transform: rotate(180deg); }

    display: grid;
    grid-template-columns: 90px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,0.05);

  .week-label { font-family: 'JetBrains Mono', monospace; color: var(--gold-300); font-size: 12px; letter-spacing: 0.05em; }
  .week-hrs { color: var(--text-muted); font-size: 12px; }
  .week-amt { font-weight: 700; text-align: right; min-width: 80px; }
  .week-amt.unpaid { color: var(--coral); }

    border-radius: 6px;
    font-size: 11px;

    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.05em;

  .mark-btn.mark-paid {
    background: linear-gradient(135deg, var(--emerald), #10b981);
    color: var(--navy-950);
  }

  .mark-btn.mark-unpaid {

  /* Premium hero header */
  .hero {
    position: relative;
    background: linear-gradient(135deg, rgba(200,168,75,0.08) 0%, rgba(30,58,99,0.4) 100%);

  .hero-title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -1.5px;
    background: linear-gradient(180deg, #fff, var(--gold-300));

  .hero-sub {

    font-size: 13px;
    letter-spacing: 0.05em;
  }
  /* Better stat cards */
  .stat-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;

  .wk-badge.paid { background: rgba(52,211,153,0.1); color: var(--emerald); border: 1px solid rgba(52,211,153,0.2); }
  .wk-badge.unpaid { background: rgba(255,107,94,0.1); color: var(--coral); border: 1px solid rgba(255,107,94,0.2); }
  .week-amt.running { color: var(--emerald); }
  .running-amt {
    color: var(--emerald);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;

  }

    background: rgba(52,211,153,0.1);
    color: var(--emerald);
    border: 1px solid rgba(52,211,153,0.2);

    display: inline-block;
    text-align: center;

  .week-row {
    grid-template-columns: 90px 1fr auto !important;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;

    min-width: 130px;
    transition: all 0.15s;

  .status-pill:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .status-pill:active { transform: scale(0.97); }
  .status-pill.locked { cursor: default; opacity: 0.85; }
  .status-pill.locked:hover { transform: none; filter: none; }

  .pill-owed {
    background: rgba(255,107,94,0.15);
    color: var(--coral);
    border-color: rgba(255,107,94,0.35);

    background: rgba(52,211,153,0.15);
    color: var(--emerald);

    background: linear-gradient(135deg, rgba(200,168,75,0.15), rgba(52,211,153,0.1));

    border-color: rgba(200,168,75,0.35);

  .pill-running::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--emerald);
    margin-right: 6px;
    box-shadow: 0 0 6px var(--emerald);

    0%, 100% { opacity: 1; }

  @media (max-width: 640px) {
    .week-row {
      grid-template-columns: auto 1fr auto !important;

      min-width: 0;

      letter-spacing: 0.04em;
    }

  @media (max-width: 400px) {
    .week-row { gap: 6px; padding: 8px 10px; }
    .week-row .week-label { font-size: 10px; }
    .week-row .week-hrs { font-size: 9px; }
    .status-pill { padding: 6px 8px; font-size: 9px; }

  .status-pill { white-space: nowrap; }

  @media (max-width: 640px) {
    .hero { padding: 20px 16px; }
    .hero-title { font-size: 28px !important; }
    .staff-card { padding: 14px; }
    .staff-name { font-size: 15px; }

  /* Confirmation modal */
  #confirm-modal {

  }
  #confirm-modal.show { opacity: 1; }
  .cm-backdrop {
    position: absolute; inset: 0;
    background: rgba(6, 13, 26, 0.75);
    backdrop-filter: blur(4px);
  }
  .cm-card {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    background: linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 16px;
    padding: 24px 24px 20px;
    width: min(92vw, 360px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: transform 0.2s;
  }
  #confirm-modal.show .cm-card { transform: translate(-50%, -50%) scale(1); }
  .cm-title {
    font-family: 'Playfair Display', 'Inter', serif;
    font-size: 20px; font-weight: 700;
    color: var(--gold-300);
    margin-bottom: 10px;
    letter-spacing: -0.3px;
  }
  .cm-message {
    color: rgba(255,255,255,0.75);
    font-size: 14px; line-height: 1.5;
    margin-bottom: 12px;
  }
  .cm-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 700;
    color: var(--gold-300);
    margin-bottom: 20px;
    text-align: center;
    padding: 10px;
    background: rgba(200,168,75,0.08);
    border: 1px dashed rgba(200,168,75,0.25);
    border-radius: 10px;

  .cm-amount:empty { display: none; }
  .cm-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;

  .cm-cancel, .cm-ok {
    padding: 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .cm-cancel {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);

  .cm-cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .cm-ok.cm-primary {
    background: linear-gradient(135deg, var(--gold-300), var(--gold-500));
    color: var(--navy-950);
  }
  .cm-ok.cm-danger {
    background: linear-gradient(135deg, #ff6b5e, #d9493e);
    color: #fff;
  }
  .cm-ok:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .cm-ok:active { transform: scale(0.97); }
</style>

<script>
// Context-aware Home button — route staff back to staff.html, admin to admin index
(function() {
  const params = new URLSearchParams(window.location.search);
  // Set flag if came from staff
  if (params.get('staff') === '1') {
    sessionStorage.setItem('lalh_user_type', 'staff');
  }
  // Check flag and redirect home button
  const userType = sessionStorage.getItem('lalh_user_type');
  if (userType === 'staff') {
    document.addEventListener('DOMContentLoaded', () => {
      const homeBtn = document.getElementById('home-fab');
      if (homeBtn) homeBtn.href = 'staff.html';
      // Also any Back links
      document.querySelectorAll('a.back').forEach(a => {
        if (a.getAttribute('href') === './') a.href = 'staff.html';
      });
    });
  }
})();
</script>

<script>
const SUPABASE_URL = 'https://abbfjjtyitftthwkwybl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9PE5YF-QfY4i2cf-G2Is1w_Xq9BvaoG';
const START_WEEK = '2026-W36'; // Only look at W31 onwards

let sb;
let currentFilter = 'unpaid';
let staffData = {}; // { staffId: { name, weeks: [{wk, hrs, amt, paid}], totalOwed } }



// Auto-init on load (no password on inner pages)
window.addEventListener('DOMContentLoaded', () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  if (typeof loadData === 'function') loadData();
  else if (typeof loadAllJobs === 'function') loadAllJobs();
  else if (typeof loadWeeks === 'function') loadWeeks();
});

// (password removed)


function getCurrentWeek() {
  const now = new Date();
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  const yr = mon.getFullYear();
  const start = new Date(yr, 0, 1);
  const wn = Math.ceil(((mon - start) / 86400000 + start.getDay() + 1) / 7);
  return yr + '-W' + String(wn).padStart(2, '0');
}
const CURRENT_WEEK = getCurrentWeek();
// Check if in view-only mode
const IS_VIEW_ONLY = new URLSearchParams(location.search).get('view') === '1';


const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function calcH(from, to) {
  if (!from || !to) return 0;
  const [fh, fm] = from.split(':').map(Number);
  const [th, tm] = to.split(':').map(Number);
  let m = (th*60+tm)-(fh*60+fm);
  if (m<0) m+=1440;
  return m/60;
}

function money(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

async function loadData() {
  document.getElementById('staff-list').innerHTML = '<div class="loading">Loading...</div>';

  // Fetch everything we need from Supabase
  const { data: allRows, error } = await sb
    .from('roster_data')
    .select('key, value')
    .or('key.eq.roster_global,key.like.roster_wk_%,key.like.roster_rates_%,key.like.wages_paid_%,key.like.roster_snapshot_%');

  if (error) {
    document.getElementById('staff-list').innerHTML = '<div class="loading">Error: ' + error.message + '</div>';
    return;
  }

  // Parse rows into maps
  const map = {};
  allRows.forEach(r => { map[r.key] = r.value; });

  const global = JSON.parse(map['roster_global'] || '{"people":[]}');

  // Get all weeks from W31 onwards
  const weeks = [];
  Object.keys(map).forEach(k => {
    if (k.startsWith('roster_wk_')) {
      const wk = k.replace('roster_wk_', '');
      if (wk >= START_WEEK) weeks.push(wk);
    }
  });
  weeks.sort();

  // Build staff data structure
  staffData = {};

  // Include all active + inactive people who might have entries
  global.people.forEach(p => {
    staffData[p.id] = { id: p.id, name: p.name, inactive: !!p.inactive, weeks: [], totalOwed: 0, totalPaid: 0 };
  });

  weeks.forEach(wk => {
    const roster = JSON.parse(map['roster_wk_' + wk] || '{}');
    const rates = JSON.parse(map['roster_rates_' + wk] || '{}');
    const paidStatus = JSON.parse(map['wages_paid_' + wk] || '{}');
    const snapshot = map['roster_snapshot_' + wk] ? JSON.parse(map['roster_snapshot_' + wk]) : null;
    const weekPeople = (snapshot && Array.isArray(snapshot) && snapshot.length) ? snapshot : global.people;

    weekPeople.forEach(p => {
      if (!staffData[p.id]) {
        staffData[p.id] = { id: p.id, name: p.name, inactive: !!p.inactive, weeks: [], totalOwed: 0, totalPaid: 0 };
      }
      let hrs = 0, extras = 0;
      DAYS.forEach(d => {
        const e = (roster[p.id] || {})[d] || {};
        if (e.timeFrom && e.timeTo && !e.off) hrs += calcH(e.timeFrom, e.timeTo);
        extras += parseFloat(e.parking||0) + parseFloat(e.materials||0) + parseFloat(e.fuel||0);
      });
      if (hrs === 0 && extras === 0) return;
      const rate = parseFloat(rates[p.id] !== undefined ? rates[p.id] : (p.rate || 30));
      const wages = hrs * rate;
      const amt = wages + extras;
      const isPaid = paidStatus[p.id] === 'paid' || paidStatus[p.id] === true;
      const isRunning = wk === CURRENT_WEEK;
      staffData[p.id].weeks.push({ wk, hrs, rate, wages, extras, amt, paid: isPaid, running: isRunning });
      // Current week counts as "running" — not owed, not paid — until Monday of next week
      if (isRunning) {
        staffData[p.id].totalRunning = (staffData[p.id].totalRunning || 0) + amt;
      } else if (isPaid) {
        staffData[p.id].totalPaid += amt;
      } else {
        staffData[p.id].totalOwed += amt;
      }
    });
  });

  render();
}

function render() {
  const staffArr = Object.values(staffData)
    .filter(s => s.weeks.length > 0)
    .sort((a, b) => b.totalOwed - a.totalOwed);

  // Filter
  let displayed = staffArr;
  if (currentFilter === 'unpaid') displayed = staffArr.filter(s => s.totalOwed > 0);
  if (currentFilter === 'paid') displayed = staffArr.filter(s => s.totalOwed === 0);

  // Top stats (based on unpaid regardless of filter)
  const totalOwed = staffArr.reduce((s, x) => s + x.totalOwed, 0);
  const peopleWithUnpaid = staffArr.filter(s => s.totalOwed > 0).length;
  const unpaidWeekCount = staffArr.reduce((s, x) => s + x.weeks.filter(w => !w.paid && !w.running).length, 0);
  const runningTotal = staffArr.reduce((s, x) => s + (x.totalRunning || 0), 0);
  const runningPeople = staffArr.filter(s => (s.totalRunning || 0) > 0).length;

  document.getElementById('stat-owed').textContent = money(totalOwed);
  document.getElementById('stat-owed-sub').textContent = peopleWithUnpaid + ' people · ' + unpaidWeekCount + ' weeks';
  document.getElementById('stat-running').textContent = money(runningTotal);
  document.getElementById('stat-running-sub').textContent = runningPeople + ' people · ' + CURRENT_WEEK;

  const list = document.getElementById('staff-list');
  if (displayed.length === 0) {
    list.innerHTML = '<div class="loading">' +
      (currentFilter === 'unpaid' ? '✓ All caught up — nobody owed anything!' :
       currentFilter === 'paid' ? 'Nobody fully paid yet' :
       'No payment data yet') + '</div>';
    return;
  }

  list.innerHTML = displayed.map(s => {
    const unpaidWeeks = s.weeks.filter(w => !w.paid && !w.running);
    const runningAmt = s.totalRunning || 0;
    const cardClass = s.totalOwed === 0 ? 'staff-card all-paid' : 'staff-card';
    const dotColor = s.totalOwed === 0 ? 'var(--emerald)' : (unpaidWeeks.length >= 3 ? 'var(--coral)' : 'var(--amber)');

    const weekRowsHtml = s.weeks.slice().reverse().map(w => {
      // Status pill - single element that is both status indicator AND action
      let pillClass, pillLabel, pillAction;
      if (w.running) {
        pillClass = 'pill-running';
        pillLabel = 'RUNNING · ' + money(w.amt);
        pillAction = ''; // no action - locked
      } else if (w.paid) {
        pillClass = 'pill-paid';
        pillLabel = '✓ PAID · ' + money(w.amt);
        pillAction = IS_VIEW_ONLY ? '' : `onclick="event.stopPropagation();togglePaid('${s.id}','${w.wk}',false)"`;
      } else {
        pillClass = 'pill-owed';
        pillLabel = '◉ OWED · ' + money(w.amt);
        pillAction = IS_VIEW_ONLY ? '' : `onclick="event.stopPropagation();togglePaid('${s.id}','${w.wk}',true)"`;
      }
      const pillTag = pillAction ? `<button class="status-pill ${pillClass}" ${pillAction}>${pillLabel}</button>` : `<span class="status-pill ${pillClass} locked">${pillLabel}</span>`;
      return `
      <div class="week-row">
        <div class="week-label">${w.wk}</div>
        <div class="week-hrs">${w.hrs.toFixed(1)}h × $${w.rate}${w.extras>0?' +'+money(w.extras)+' extras':''}</div>
        ${pillTag}
      </div>`;
    }).join('');

    return `
      <div class="staff-card ${s.totalOwed === 0 ? 'all-paid' : ''}" id="staff-${s.id}">
        <div class="staff-header" onclick="toggleCard('${s.id}')">
          <div class="staff-name-block">
            <div class="staff-dot" style="background:${dotColor}"></div>
            <div>
              <div class="staff-name">${s.name}${s.inactive?' <span style="color:var(--text-muted);font-size:11px;">[inactive]</span>':''}</div>
              <div class="staff-meta">${unpaidWeeks.length} unpaid${runningAmt>0?' · 1 running':''} / ${s.weeks.length} total</div>
            </div>
          </div>
          <div style="text-align:right;">
            <span class="staff-owed ${s.totalOwed === 0 ? 'zero' : ''}">${s.totalOwed === 0 ? (runningAmt > 0 ? '' : '✓ Clear') : money(s.totalOwed)}</span>
            ${runningAmt > 0 ? '<div class="running-amt">'+money(runningAmt)+' running</div>' : ''}
            <span class="expand-icon">▼</span>
          </div>
        </div>
        <div class="week-list">
          ${weekRowsHtml}
        </div>
      </div>`;
  }).join('');
}

function toggleCard(id) {
  const card = document.getElementById('staff-' + id);
  if (card) card.classList.toggle('expanded');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  render();
}

async function togglePaid(staffId, wk, markAsPaid) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    // Fetch current paid status
    const { data: cur } = await sb.from('roster_data').select('value').eq('key', 'wages_paid_' + wk).maybeSingle();
    const paidStatus = cur ? JSON.parse(cur.value) : {};
    if (markAsPaid) {
      paidStatus[staffId] = 'paid';
    } else {
      delete paidStatus[staffId];
    }
    await sb.from('roster_data').upsert({
      key: 'wages_paid_' + wk,
      value: JSON.stringify(paidStatus),
      updated: new Date().toISOString()
    }, { onConflict: 'key' });

    // Update local data & re-render
    const s = staffData[staffId];
    if (s) {
      const wkEntry = s.weeks.find(w => w.wk === wk);
      if (wkEntry) {
        if (wkEntry.paid && !markAsPaid) {
          s.totalPaid -= wkEntry.amt;
          s.totalOwed += wkEntry.amt;
        } else if (!wkEntry.paid && markAsPaid) {
          s.totalOwed -= wkEntry.amt;
          s.totalPaid += wkEntry.amt;
        }
        wkEntry.paid = markAsPaid;
      }
    }
    render();
    // Keep card expanded
    const card = document.getElementById('staff-' + staffId);
    if (card) card.classList.add('expanded');
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
  }
}
</script>

<!-- Confirmation Modal -->
<div id="confirm-modal" style="display:none;">
  <div class="cm-backdrop" onclick="confirmCancel()"></div>
  <div class="cm-card">
    <div class="cm-title" id="cm-title">Confirm</div>
    <div class="cm-message" id="cm-message"></div>
    <div class="cm-amount" id="cm-amount"></div>
    <div class="cm-actions">
      <button class="cm-cancel" onclick="confirmCancel()">Cancel</button>
      <button class="cm-ok" id="cm-ok-btn" onclick="confirmOk()">Confirm</button>
    </div>
  </div>
</div>

<script>
// ── Confirmation Modal ──
let _confirmResolve = null;

function askConfirm(opts) {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    document.getElementById('cm-title').textContent = opts.title || 'Confirm';
    document.getElementById('cm-message').textContent = opts.message || 'Are you sure?';
    document.getElementById('cm-amount').textContent = opts.amount || '';
    const okBtn = document.getElementById('cm-ok-btn');
    okBtn.textContent = opts.okLabel || 'Confirm';
    okBtn.className = 'cm-ok ' + (opts.danger ? 'cm-danger' : 'cm-primary');
    document.getElementById('confirm-modal').style.display = 'block';
    setTimeout(() => document.getElementById('confirm-modal').classList.add('show'), 10);
  });
}

function confirmOk() {
  if (_confirmResolve) _confirmResolve(true);
  closeConfirm();
}
function confirmCancel() {
  if (_confirmResolve) _confirmResolve(false);
  closeConfirm();
}
function closeConfirm() {
  const m = document.getElementById('confirm-modal');
  m.classList.remove('show');
  setTimeout(() => { m.style.display = 'none'; _confirmResolve = null; }, 200);
}

// Escape key closes modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('confirm-modal').style.display === 'block') {
    confirmCancel();
  }
});
</script>
