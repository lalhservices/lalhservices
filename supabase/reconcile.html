<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Reconciliation — LALH Services</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8a84b">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23f4d374"/><stop offset="1" stop-color="%23c8a84b"/></linearGradient></defs><path d="M50 5 L92 50 L50 95 L8 50 Z" fill="%230d1a30" stroke="url(%23g)" stroke-width="3"/><path d="M32 32 L32 68 L52 68 L52 62 L38 62 L38 32 Z" fill="url(%23g)"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy-950: #060d1a;
    --navy-900: #0d1a30;
    --navy-800: #142748;
    --navy-700: #1e3a63;
    --gold-300: #f4d374;
    --gold-500: #c8a84b;
    --emerald: #34d399;
    --coral: #ff6b5e;
    --amber: #fbbf24;
    --text-muted: rgba(255,255,255,0.55);
  }
  body {
    background: radial-gradient(ellipse at top, var(--navy-800), var(--navy-950));
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 80px;
  }
  .container { max-width: 760px; margin: 0 auto; }
  a.back { display: inline-block; margin-bottom: 20px; color: var(--gold-300); text-decoration: none; font-size: 12px; letter-spacing: 0.1em; }

  .hero {
    background: linear-gradient(135deg, rgba(200,168,75,0.08), rgba(30,58,99,0.3));
    border: 1px solid rgba(200,168,75,0.15);
    border-radius: 16px;
    padding: 22px 26px;
    margin-bottom: 22px;
  }
  .hero-eyebrow { font-size: 10px; letter-spacing: 0.25em; color: var(--gold-500); font-weight: 700; margin-bottom: 6px; }
  h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--gold-300); font-weight: 700; letter-spacing: -0.5px; }
  .hero-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; }

  .week-nav {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .week-nav button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .week-nav button:hover { border-color: var(--gold-500); color: var(--gold-300); }
  .week-label {
    flex: 1;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--gold-300);
    letter-spacing: 0.08em;
    font-weight: 700;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-left: 8px;
  }
  .status-pending { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); color: var(--amber); }
  .status-matched { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.35); color: var(--emerald); }
  .status-mismatch { background: rgba(255,107,94,0.12); border: 1px solid rgba(255,107,94,0.35); color: var(--coral); }

  .section {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .section-label {
    font-size: 10px;
    color: var(--gold-500);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::before {
    content: ''; display: block; width: 3px; height: 14px;
    background: var(--gold-500); border-radius: 2px;
  }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fields.single { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 10px; color: var(--text-muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    font-weight: 600;
  }
  .field input, .field textarea {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 12px;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }
  .field input[type="number"], .field input[type="text"][data-money] {
    font-family: 'JetBrains Mono', monospace;
  }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--gold-500); background: rgba(0,0,0,0.4);
  }
  .field textarea { min-height: 70px; resize: vertical; font-family: inherit; }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    gap: 8px 14px;
    align-items: center;
    margin-bottom: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }
  .compare-row { display: contents; }
  .compare-row > div { padding: 4px 0; }
  .compare-label {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.05em; text-transform: uppercase;
    font-weight: 600;
  }
  .compare-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 700;
    color: #fff; text-align: right;
  }
  .compare-val.system { color: var(--gold-300); }
  .compare-val.actual { color: #fff; }
  .compare-status {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 10px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
  .compare-status.match { background: rgba(52,211,153,0.12); color: var(--emerald); }
  .compare-status.mismatch { background: rgba(255,107,94,0.12); color: var(--coral); }
  .compare-status.pending { background: rgba(251,191,36,0.08); color: var(--amber); }
  .compare-header {
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-muted); text-transform: uppercase;
    font-weight: 700; padding: 4px 0 8px;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
  }
  .compare-header.right { text-align: right; }

  .save-badge {
    display: inline-block; font-size: 11px;
    color: var(--emerald); opacity: 0;
    transition: opacity 0.3s;
  }
  .save-badge.show { opacity: 1; }

  .url-row { display: flex; gap: 6px; }
  .url-row input { flex: 1; }
  .url-btn {
    background: rgba(200,168,75,0.12);
    border: 1px solid rgba(200,168,75,0.3);
    color: var(--gold-300);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    font-family: inherit;
  }
  .url-btn:hover { background: rgba(200,168,75,0.22); }
  .url-btn.disabled { opacity: 0.4; pointer-events: none; }

  @media (max-width: 640px) {
    .fields { grid-template-columns: 1fr; }
    .compare-grid { grid-template-columns: 1fr auto; }
    .compare-header, .compare-label, .compare-val, .compare-status {
      padding: 2px 0;
    }
    .compare-header.right { display: none; }
  }

  #home-fab {
    position: fixed; bottom: 16px; right: 16px; z-index: 9998;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(200,168,75,0.85); color: #060d1a; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); text-decoration: none;
    opacity: 0.55; transition: all 0.2s;
  }
  #home-fab:hover { opacity: 1; transform: scale(1.1); }
</style>
</head>
<body>

<div class="container">
  <a href="./" class="back">← Back</a>

  <div class="hero">
    <div class="hero-eyebrow">WEEKLY RECONCILIATION</div>
    <h1>Reconcile <span id="status-pill"></span></h1>
    <div class="hero-sub">Cross-check what the system calculated vs what you actually sent/paid</div>
  </div>

  <div class="week-nav">
    <button onclick="changeWeek(-1)">← Prev</button>
    <div class="week-label" id="week-label">Loading...</div>
    <button onclick="changeWeek(1)">Next →</button>
    <button onclick="goThisWeek()">This Week</button>
  </div>

  <!-- System vs Actual Comparison -->
  <div class="section">
    <div class="section-label">System vs Actual · Match Check</div>
    <div class="compare-grid">
      <div class="compare-header">Line Item</div>
      <div class="compare-header right">System</div>
      <div class="compare-header right">Actual</div>
      <div class="compare-header right">Match</div>

      <div class="compare-label">Invoice amount (incl GST)</div>
      <div class="compare-val system" id="cmp-inv-system">—</div>
      <div class="compare-val actual" id="cmp-inv-actual">—</div>
      <div class="compare-status pending" id="cmp-inv-status">—</div>

      <div class="compare-label">Total wages paid</div>
      <div class="compare-val system" id="cmp-wage-system">—</div>
      <div class="compare-val actual" id="cmp-wage-actual">—</div>
      <div class="compare-status pending" id="cmp-wage-status">—</div>
    </div>
  </div>

  <!-- Invoice Entry -->
  <div class="section">
    <div class="section-label">Invoice Sent to Client</div>
    <div class="fields">
      <div class="field"><label>Invoice No</label><input type="text" id="f-inv-no" placeholder="e.g. 600" oninput="save()"></div>
      <div class="field"><label>Amount Sent (incl GST)</label><input type="number" step="0.01" id="f-inv-amt" placeholder="0.00" oninput="save()"></div>
      <div class="field"><label>Date Sent</label><input type="date" id="f-inv-date" oninput="save()"></div>
      <div class="field"><label>Date Paid by Client</label><input type="date" id="f-inv-paid-date" oninput="save()"></div>
    </div>
    <div class="fields single" style="margin-top:12px;">
      <div class="field">
        <label>Invoice PDF URL (Google Drive / Dropbox)</label>
        <div class="url-row">
          <input type="url" id="f-inv-url" placeholder="https://..." oninput="save()">
          <a href="#" target="_blank" class="url-btn disabled" id="inv-url-open">Open</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Wages Entry -->
  <div class="section">
    <div class="section-label">Wages Paid Out</div>
    <div class="fields">
      <div class="field"><label>Total Wages Paid</label><input type="number" step="0.01" id="f-wage-amt" placeholder="0.00" oninput="save()"></div>
      <div class="field"><label>Date Wages Paid</label><input type="date" id="f-wage-date" oninput="save()"></div>
    </div>
  </div>

  <!-- Notes -->
  <div class="section">
    <div class="section-label">Notes</div>
    <div class="fields single">
      <div class="field"><textarea id="f-notes" placeholder="Any discrepancies, adjustments, reasons..." oninput="save()"></textarea></div>
    </div>
    <div style="margin-top:12px;"><span class="save-badge" id="save-badge">✓ Saved</span></div>
  </div>
</div>

<a href="./" id="home-fab" title="Home">🏠</a>

<script>
const SUPABASE_URL = 'https://abbfjjtyitftthwkwybl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9PE5YF-QfY4i2cf-G2Is1w_Xq9BvaoG';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

let sb;
let offset = -1; // default to last week (Monday morning habit = reconcile what just ended)
let currentWk = null;
let currentData = {};
let saveTimer = null;

function calcH(from, to) {
  if (!from || !to) return 0;
  const [fh, fm] = from.split(':').map(Number);
  const [th, tm] = to.split(':').map(Number);
  let m = (th*60+tm) - (fh*60+fm);
  if (m < 0) m += 1440;
  return m / 60;
}
function money(n) {
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function weekDates(off) {
  const now = new Date(), d = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - d + (d === 0 ? -6 : 1) + off * 7);
  mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { mon, sun };
}
function weekKey(off) {
  const { mon } = weekDates(off);
  const yr = mon.getFullYear();
  const start = new Date(yr, 0, 1);
  const wn = Math.ceil(((mon - start) / 86400000 + start.getDay() + 1) / 7);
  return yr + '-W' + String(wn).padStart(2, '0');
}

function changeWeek(dir) { offset += dir; load(); }
function goThisWeek() { offset = 0; load(); }

async function load() {
  const wk = weekKey(offset);
  currentWk = wk;
  const { mon, sun } = weekDates(offset);
  const fmt = (d) => d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  document.getElementById('week-label').textContent = 'W' + wk.split('W')[1] + ' · ' + fmt(mon) + ' – ' + fmt(sun);

  // Fetch everything we need: current reconcile entry + source data to compute system totals
  const keys = [
    `reconcile_${wk}`,
    'roster_global',
    `roster_wk_${wk}`,
    `roster_rates_${wk}`,
    `roster_snapshot_${wk}`,
    'jt2_global',
    `jt2_wk_${wk}`,
    `jt2_rate_${wk}`
  ];
  const { data, error } = await sb.from('roster_data').select('key, value').in('key', keys);
  if (error) { console.error(error); return; }
  const map = {};
  (data || []).forEach(r => { map[r.key] = r.value; });

  // Load saved reconcile data if any
  currentData = map[`reconcile_${wk}`] ? JSON.parse(map[`reconcile_${wk}`]) : {};
  populateFields(currentData);

  // Compute system totals
  const system = computeSystem(wk, map);
  renderCompare(system);
}

function computeSystem(wk, map) {
  // System invoice total (incl GST)
  const jobsGlobal = JSON.parse(map['jt2_global'] || '{"rows":[]}');
  const jobsWk = JSON.parse(map[`jt2_wk_${wk}`] || '{}');
  const jobRate = parseFloat(map[`jt2_rate_${wk}`] || 45);
  const hiddenRows = jobsWk._hidden || [];

  let charged = 0, parking = 0, materials = 0;
  (jobsGlobal.rows || []).forEach(rid => {
    if (hiddenRows.includes(rid)) return;
    DAYS.forEach(day => {
      const cell = jobsWk[`${rid}|${day}`];
      if (!cell || !cell.jobName) return;
      let hrs = 0;
      (cell.workers || []).forEach(w => { hrs += calcH(w.from, w.to); });
      charged += hrs * jobRate;
      parking += parseFloat(cell.parking || 0) || 0;
      materials += parseFloat(cell.materials || 0) || 0;
    });
  });

  const labourExcl = charged;
  const extrasExcl = parking + materials;
  const totalExcl = labourExcl + extrasExcl;
  const gst = Math.round(labourExcl * 0.10 * 100) / 100;
  const invoiceInclGst = totalExcl + gst;

  // System wages total
  const global = JSON.parse(map['roster_global'] || '{"people":[]}');
  const snapshot = map[`roster_snapshot_${wk}`] ? JSON.parse(map[`roster_snapshot_${wk}`]) : null;
  const rates = JSON.parse(map[`roster_rates_${wk}`] || '{}');
  let people = (snapshot && snapshot.length) ? snapshot : (global.people || []);
  people = people.map(p => ({ ...p, rate: rates[p.id] !== undefined ? rates[p.id] : p.rate }));
  const roster = JSON.parse(map[`roster_wk_${wk}`] || '{}');

  let wages = 0;
  people.forEach(p => {
    DAYS.forEach(day => {
      const e = (roster[p.id] || {})[day];
      if (!e || e.off) return;
      if (e.timeFrom && e.timeTo) {
        const h = calcH(e.timeFrom, e.timeTo);
        wages += h * parseFloat(p.rate || 30);
      }
      wages += parseFloat(e.parking || 0) || 0;
      wages += parseFloat(e.materials || 0) || 0;
      wages += parseFloat(e.fuel || 0) || 0;
    });
  });

  return { invoiceInclGst, wages };
}

function renderCompare(system) {
  const actualInv = parseFloat(currentData.invoiceAmount || 0);
  const actualWage = parseFloat(currentData.wagesAmount || 0);

  document.getElementById('cmp-inv-system').textContent = money(system.invoiceInclGst);
  document.getElementById('cmp-wage-system').textContent = money(system.wages);

  // Invoice compare
  if (!currentData.invoiceAmount) {
    document.getElementById('cmp-inv-actual').textContent = '—';
    document.getElementById('cmp-inv-status').textContent = 'PENDING';
    document.getElementById('cmp-inv-status').className = 'compare-status pending';
  } else {
    document.getElementById('cmp-inv-actual').textContent = money(actualInv);
    const diff = Math.abs(actualInv - system.invoiceInclGst);
    if (diff <= 1) {
      document.getElementById('cmp-inv-status').textContent = '✓ MATCH';
      document.getElementById('cmp-inv-status').className = 'compare-status match';
    } else {
      document.getElementById('cmp-inv-status').textContent = '⚠ ' + money(diff);
      document.getElementById('cmp-inv-status').className = 'compare-status mismatch';
    }
  }

  // Wages compare
  if (!currentData.wagesAmount) {
    document.getElementById('cmp-wage-actual').textContent = '—';
    document.getElementById('cmp-wage-status').textContent = 'PENDING';
    document.getElementById('cmp-wage-status').className = 'compare-status pending';
  } else {
    document.getElementById('cmp-wage-actual').textContent = money(actualWage);
    const diff = Math.abs(actualWage - system.wages);
    if (diff <= 1) {
      document.getElementById('cmp-wage-status').textContent = '✓ MATCH';
      document.getElementById('cmp-wage-status').className = 'compare-status match';
    } else {
      document.getElementById('cmp-wage-status').textContent = '⚠ ' + money(diff);
      document.getElementById('cmp-wage-status').className = 'compare-status mismatch';
    }
  }

  // Overall status pill
  const pill = document.getElementById('status-pill');
  if (!currentData.invoiceAmount || !currentData.wagesAmount) {
    pill.textContent = 'Pending';
    pill.className = 'status-badge status-pending';
  } else {
    const diffI = Math.abs(actualInv - system.invoiceInclGst);
    const diffW = Math.abs(actualWage - system.wages);
    if (diffI <= 1 && diffW <= 1) {
      pill.textContent = 'Reconciled';
      pill.className = 'status-badge status-matched';
    } else {
      pill.textContent = 'Mismatch';
      pill.className = 'status-badge status-mismatch';
    }
  }

  // Update PDF Open button
  const openBtn = document.getElementById('inv-url-open');
  if (currentData.invoiceUrl) {
    openBtn.href = currentData.invoiceUrl;
    openBtn.classList.remove('disabled');
  } else {
    openBtn.href = '#';
    openBtn.classList.add('disabled');
  }
}

function populateFields(d) {
  document.getElementById('f-inv-no').value = d.invoiceNo || '';
  document.getElementById('f-inv-amt').value = d.invoiceAmount || '';
  document.getElementById('f-inv-date').value = d.invoiceDate || '';
  document.getElementById('f-inv-paid-date').value = d.invoicePaidDate || '';
  document.getElementById('f-inv-url').value = d.invoiceUrl || '';
  document.getElementById('f-wage-amt').value = d.wagesAmount || '';
  document.getElementById('f-wage-date').value = d.wagesDate || '';
  document.getElementById('f-notes').value = d.notes || '';
}

function save() {
  currentData = {
    invoiceNo: document.getElementById('f-inv-no').value,
    invoiceAmount: document.getElementById('f-inv-amt').value,
    invoiceDate: document.getElementById('f-inv-date').value,
    invoicePaidDate: document.getElementById('f-inv-paid-date').value,
    invoiceUrl: document.getElementById('f-inv-url').value,
    wagesAmount: document.getElementById('f-wage-amt').value,
    wagesDate: document.getElementById('f-wage-date').value,
    notes: document.getElementById('f-notes').value,
    lastUpdated: new Date().toISOString()
  };

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const payload = JSON.stringify(currentData);
    const { error } = await sb.from('roster_data').upsert(
      { key: `reconcile_${currentWk}`, value: payload },
      { onConflict: 'key' }
    );
    if (error) { console.error('Save error:', error); return; }

    const badge = document.getElementById('save-badge');
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 1500);

    // Re-render comparison after save
    await load();
  }, 500);
}

window.addEventListener('DOMContentLoaded', () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  load();
});
</script>
</body>
</html>
