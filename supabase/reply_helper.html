<script>
const SUPABASE_URL = 'https://abbfjjtyitftthwkwybl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9PE5YF-QfY4i2cf-G2Is1w_Xq9BvaoG';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

let sb;
let allJobs = [];
let uniqueJobNames = [];
let weeksRange = 8;

// Common word substitutions for smarter matching
const SUBSTITUTIONS = [
  ['fone', 'phone'],
  ['phone', 'fone'],
  ['street', 'st'],
  ['st', 'street'],
  ['road', 'rd'],
  ['rd', 'road'],
  ['avenue', 'ave'],
  ['ave', 'avenue'],
  ['center', 'centre'],
  ['centre', 'center'],
  ['seven eleven', '711'],
  ['711', '7/11'],
  ['7/11', '711'],
  ['and', '&'],
  ['&', 'and']
];

// Stop words to ignore
const STOP_WORDS = new Set([
  'the','and','or','of','at','in','on','a','an','to','for','by','with','from',
  'can','you','please','hi','hey','hello','thanks','thank','regards','kind',
  'sir','madam','best','good','morning','afternoon','evening','us','me','my',
  'we','our','your','his','her','their','is','are','was','were','be','been',
  'last','week','today','yesterday','tomorrow','timing','timings','time','times',
  'hours','hour','confirm','need','also','that','this','which','what','when',
  'where','why','how'
]);

function calcH(from, to) {
  if (!from || !to) return 0;
  const [fh, fm] = from.split(':').map(Number);
  const [th, tm] = to.split(':').map(Number);
  let m = (th*60+tm) - (fh*60+fm);
  if (m < 0) m += 1440;
  return m / 60;
}

function toTime12(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return h12 + (m > 0 ? ':' + String(m).padStart(2,'0') : '') + period;
}

function weekToDates(wk) {
  const [year, wkPart] = wk.split('-W');
  const yr = parseInt(year);
  const wn = parseInt(wkPart);
  const jan4 = new Date(yr, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const week1Mon = new Date(jan4);
  week1Mon.setDate(jan4.getDate() - jan4Day + 1);
  const mon = new Date(week1Mon);
  mon.setDate(week1Mon.getDate() + (wn - 1) * 7);
  return mon;
}

function formatJobDate(wk, day) {
  const dayIdx = DAYS.indexOf(day);
  const mon = weekToDates(wk);
  const d = new Date(mon);
  d.setDate(mon.getDate() + dayIdx);
  return day + ' ' + d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
}

// Normalize text: lowercase, strip punctuation, collapse spaces
function normalize(s) {
  return (s || '').toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Expand text with common substitutions (returns a set of variations)
function expandText(s) {
  const base = normalize(s);
  const set = new Set([base]);
  SUBSTITUTIONS.forEach(([from, to]) => {
    if (base.includes(from)) {
      set.add(base.replace(new RegExp('\\b' + from + '\\b', 'g'), to));
    }
  });
  return Array.from(set).join(' ');
}

// Extract significant tokens (3+ chars, not stop words)
function tokens(s) {
  return normalize(s).split(' ').filter(w => w.length >= 3 && !STOP_WORDS.has(w));
}

// True Levenshtein distance
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array(n + 1).fill(0).map((_, i) => i);
  for (let i = 1; i <= m; i++) {
    let prev = i - 1;
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = dp[j];
      dp[j] = Math.min(
        dp[j] + 1,         // deletion
        dp[j-1] + 1,       // insertion
        prev + (a[i-1] === b[j-1] ? 0 : 1)  // substitution
      );
      prev = temp;
    }
  }
  return dp[n];
}

// Fuzzy match two single words, returns 0-1 score
function fuzzyMatch(a, b) {
  if (a === b) return 1;
  if (a.length < 3 || b.length < 3) return 0;
  // Substring match
  if (a.includes(b) || b.includes(a)) return 0.95;
  // Shared prefix (strong signal for misspellings at end)
  let prefix = 0;
  while (prefix < a.length && prefix < b.length && a[prefix] === b[prefix]) prefix++;
  if (prefix >= 4) return 0.9;
  // Levenshtein with length-based threshold
  const maxLen = Math.max(a.length, b.length);
  const maxEdits = maxLen <= 4 ? 1 : (maxLen <= 7 ? 2 : (maxLen <= 10 ? 3 : 4));
  const dist = levenshtein(a, b);
  if (dist <= maxEdits) return 1 - dist / maxLen;
  // Bigram backup for order-insensitive matches
  const bigrams = (s) => {
    const r = new Set();
    for (let i = 0; i < s.length - 1; i++) r.add(s.slice(i, i+2));
    return r;
  };
  const ba = bigrams(a), bb = bigrams(b);
  let shared = 0;
  ba.forEach(g => { if (bb.has(g)) shared++; });
  const sim = shared / Math.max(ba.size, bb.size, 1);
  return sim >= 0.5 ? sim * 0.8 : 0;
}

// Score how well emailText matches a jobName
function scoreMatch(jobName, emailText, expandedEmail) {
  const jobTokens = tokens(jobName);
  if (!jobTokens.length) return 0;

  const emailLower = normalize(emailText);

  // Perfect substring match
  const normJob = normalize(jobName);
  if (emailLower.includes(normJob) || expandedEmail.includes(normJob)) return 100;

  // Token-level matching with fuzzy
  let totalScore = 0;
  let matchedTokens = 0;
  jobTokens.forEach(jt => {
    const emailWords = expandedEmail.split(' ');
    let best = 0;
    emailWords.forEach(ew => {
      const score = fuzzyMatch(jt, ew);
      if (score > best) best = score;
    });
    if (best > 0.7) {
      matchedTokens++;
      totalScore += best;
    }
  });

  if (matchedTokens === 0) return 0;

  // Score = average token score × coverage ratio
  const coverage = matchedTokens / jobTokens.length;
  const avgScore = totalScore / matchedTokens;

  // Need at least 50% coverage to count
  if (coverage < 0.5 && jobTokens.length > 1) return 0;

  // Specific location keywords give bonus
  const locationWords = ['chermside','brisbane','kenmore','newstead','teneriffe','bardon','indooroopilly','morayfield','westend','cbd','southbank','stafford','ascot','bulimba','toowong','paddington','westend','mtgravatt','northlakes','capalaba','garden','city'];
  let hasLocation = false;
  jobTokens.forEach(jt => {
    if (locationWords.some(l => jt.includes(l) || l.includes(jt))) {
      const inEmail = expandedEmail.split(' ').some(ew => fuzzyMatch(jt, ew) > 0.7);
      if (inEmail) hasLocation = true;
    }
  });

  let finalScore = avgScore * coverage * 100;
  if (hasLocation) finalScore += 15;

  return finalScore;
}

async function loadAllJobs() {
  const { data, error } = await sb.from('roster_data').select('key, value').like('key', 'jt2_wk_%');
  if (error) { console.error('Load error:', error); return; }

  const { data: g } = await sb.from('roster_data').select('value').eq('key', 'jt2_global').maybeSingle();
  const jobsGlobal = g ? JSON.parse(g.value) : { rows: [] };
  const rows = jobsGlobal.rows || [];

  const nameSet = new Set();

  (data || []).forEach(r => {
    const wk = r.key.replace('jt2_wk_', '');
    const cells = JSON.parse(r.value || '{}');
    const hidden = cells._hidden || [];

    rows.forEach(rid => {
      if (hidden.includes(rid)) return;
      DAYS.forEach(day => {
        const cell = cells[rid + '|' + day];
        if (!cell || !cell.jobName) return;
        const workers = (cell.workers || []).filter(w => w.from && w.to);
        let totalHrs = 0;
        workers.forEach(w => { totalHrs += calcH(w.from, w.to); });
        if (totalHrs === 0 && !cell.parking && !cell.materials) return;

        allJobs.push({
          wk, day, jobName: cell.jobName,
          workers, totalHrs,
          parking: parseFloat(cell.parking || 0) || 0,
          materials: parseFloat(cell.materials || 0) || 0
        });
        nameSet.add(cell.jobName);
      });
    });
  });

  uniqueJobNames = Array.from(nameSet);
  console.log(`Loaded ${allJobs.length} entries, ${uniqueJobNames.length} unique job names`);
}

function filterByDate(jobs, maxWeeksBack) {
  if (maxWeeksBack >= 999) return jobs;
  const now = new Date();
  const d = now.getDay();
  const thisMonday = new Date(now);
  thisMonday.setDate(now.getDate() - d + (d === 0 ? -6 : 1));
  thisMonday.setHours(0,0,0,0);
  const cutoff = new Date(thisMonday);
  cutoff.setDate(thisMonday.getDate() - maxWeeksBack * 7);
  return jobs.filter(j => {
    const jobDate = weekToDates(j.wk);
    return jobDate >= cutoff;
  });
}

// ─────────── DATE PARSING ───────────
function parseDates(text) {
  const results = [];
  const now = new Date();
  const futureLimit = new Date(now);
  futureLimit.setDate(now.getDate() + 7); // Allow ~1 week into future

  // Numeric: DD/MM, DD/MM/YY, DD-MM, D.M, DD/MM/YYYY
  const re1 = /\b(\d{1,2})[\/\-\.](\d{1,2})(?:[\/\-\.](\d{2,4}))?\b/g;
  let m;
  while ((m = re1.exec(text)) !== null) {
    let day = parseInt(m[1]);
    let month = parseInt(m[2]);
    let year = m[3] ? parseInt(m[3]) : null;

    // Validate — Australian format is DD/MM
    if (month > 12 && day <= 12) [day, month] = [month, day];
    if (month < 1 || month > 12 || day < 1 || day > 31) continue;

    if (year === null) year = now.getFullYear();
    if (year < 100) year += 2000;

    let date = new Date(year, month - 1, day);
    if (date > futureLimit) date = new Date(year - 1, month - 1, day);

    results.push({ date, startIdx: m.index, endIdx: m.index + m[0].length, raw: m[0] });
  }

  // Named months: "29 Oct", "29th October", "Oct 29th"
  const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const monPat = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
  const reA = new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+${monPat}\\b`, 'gi');
  const reB = new RegExp(`\\b${monPat}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b`, 'gi');

  [reA, reB].forEach((re, i) => {
    while ((m = re.exec(text)) !== null) {
      let day, monStr;
      if (i === 0) { day = parseInt(m[1]); monStr = m[2].toLowerCase().slice(0,3); }
      else { day = parseInt(m[2]); monStr = m[1].toLowerCase().slice(0,3); }
      const month = months.indexOf(monStr) + 1;
      if (!month || day < 1 || day > 31) continue;

      let year = now.getFullYear();
      let date = new Date(year, month - 1, day);
      if (date > futureLimit) date = new Date(year - 1, month - 1, day);

      results.push({ date, startIdx: m.index, endIdx: m.index + m[0].length, raw: m[0] });
    }
  });

  // Sort, dedupe overlapping
  results.sort((a,b) => a.startIdx - b.startIdx);
  const final = [];
  results.forEach(r => {
    if (!final.length || r.startIdx >= final[final.length-1].endIdx) final.push(r);
  });
  return final;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function entryDate(j) {
  const mon = weekToDates(j.wk);
  const dayIdx = DAYS.indexOf(j.day);
  const d = new Date(mon);
  d.setDate(mon.getDate() + dayIdx);
  d.setHours(0,0,0,0);
  return d;
}

// Try to find the best matching job name in a snippet of text, from a candidate list
function findBestJobMatch(snippet, candidates) {
  if (!snippet || !snippet.trim() || !candidates.length) return null;
  const expanded = expandText(snippet);
  const scored = candidates.map(name => ({
    name,
    score: scoreMatch(name, snippet, expanded)
  })).filter(s => s.score > 25).sort((a,b) => b.score - a.score);
  return scored.length ? scored[0].name : null;
}

// Pair each parsed date with its surrounding text
function pairDatesWithText(email, parsedDates) {
  const pairs = [];
  parsedDates.forEach((d, i) => {
    const prevEnd = i > 0 ? parsedDates[i-1].endIdx : 0;
    const nextStart = i < parsedDates.length - 1 ? parsedDates[i+1].startIdx : email.length;
    const beforeText = email.slice(prevEnd, d.startIdx).trim();
    const afterText = email.slice(d.endIdx, nextStart).trim();
    pairs.push({ date: d.date, raw: d.raw, beforeText, afterText });
  });
  return pairs;
}

function lookup() {
  const emailText = document.getElementById('email-text').value.trim();
  if (!emailText) {
    showToast('Paste an email first');
    return;
  }

  const parsedDates = parseDates(emailText);

  // ───── DATE-AWARE MODE: email contains dates ─────
  if (parsedDates.length > 0) {
    const pairs = pairDatesWithText(emailText, parsedDates);
    const matches = []; // { date, jobName, entries, searchText, unmatchedReason }

    pairs.forEach(p => {
      // Only consider jobs that ACTUALLY exist on this date
      const entriesOnDate = allJobs.filter(j => sameDay(entryDate(j), p.date));

      if (!entriesOnDate.length) {
        matches.push({ date: p.date, jobName: null, entries: [], searchText: p.beforeText || p.afterText, reason: 'no_jobs_on_date' });
        return;
      }

      // Candidate job names on this date
      const dateJobNames = Array.from(new Set(entriesOnDate.map(j => j.jobName)));

      // If only one job on that date and we found a date near some job text, auto-match
      // (single job that day, no ambiguity)
      if (dateJobNames.length === 1 && (p.beforeText || p.afterText)) {
        const bestName = dateJobNames[0];
        const entries = entriesOnDate.filter(j => j.jobName === bestName);
        matches.push({ date: p.date, jobName: bestName, entries });
        return;
      }

      // Try text before date first (common email pattern: "Job Name DD/MM")
      let bestName = findBestJobMatch(p.beforeText, dateJobNames);

      // Then try text after date
      if (!bestName) bestName = findBestJobMatch(p.afterText, dateJobNames);

      // Last resort: combine both snippets
      if (!bestName) bestName = findBestJobMatch(p.beforeText + ' ' + p.afterText, dateJobNames);

      if (bestName) {
        const entries = entriesOnDate.filter(j => j.jobName === bestName);
        matches.push({ date: p.date, jobName: bestName, entries });
      } else {
        matches.push({ date: p.date, jobName: null, entries: [], searchText: p.beforeText || p.afterText, candidates: dateJobNames, reason: 'no_name_match' });
      }
    });

    // ───── DATE CARRY-OVER ─────
    // If "29 Oct Zembero and 30 Oct" → both dates = Zembero
    // For each unmatched date, inherit from nearest matched date (prev first, then next)
    matches.forEach((m, i) => {
      if (m.jobName) return; // already matched
      // Look back
      let inheritedName = null;
      for (let j = i - 1; j >= 0; j--) {
        if (matches[j].jobName) { inheritedName = matches[j].jobName; break; }
      }
      // Look forward if no previous match
      if (!inheritedName) {
        for (let j = i + 1; j < matches.length; j++) {
          if (matches[j].jobName) { inheritedName = matches[j].jobName; break; }
        }
      }
      if (!inheritedName) return;

      // Try strict: same job name exists on this date
      let inheritedEntries = allJobs.filter(e => sameDay(entryDate(e), m.date) && e.jobName === inheritedName);

      // If not strict match, try fuzzy match against similar job names on this date
      if (!inheritedEntries.length) {
        const candidates = Array.from(new Set(allJobs.filter(e => sameDay(entryDate(e), m.date)).map(e => e.jobName)));
        const fuzzyName = findBestJobMatch(inheritedName, candidates);
        if (fuzzyName) {
          inheritedEntries = allJobs.filter(e => sameDay(entryDate(e), m.date) && e.jobName === fuzzyName);
          if (inheritedEntries.length) {
            m.jobName = fuzzyName;
            m.entries = inheritedEntries;
            m.inherited = true;
            m.inheritedFrom = inheritedName;
            return;
          }
        }
        // No entries at all → still show the inherited name but mark as "no data"
        m.jobName = inheritedName;
        m.entries = [];
        m.inherited = true;
        m.noDataOnDate = true;
      } else {
        m.jobName = inheritedName;
        m.entries = inheritedEntries;
        m.inherited = true;
      }
    });

    renderDateAwareResults(matches);
    return;
  }

  // ───── FUZZY-ONLY MODE: no dates in email ─────
  const expandedEmail = expandText(emailText);
  const scored = uniqueJobNames.map(name => ({
    name,
    score: scoreMatch(name, emailText, expandedEmail)
  })).filter(s => s.score > 50).sort((a,b) => b.score - a.score);

  const matchedNames = scored.slice(0, 15).map(s => s.name);

  const matchedEl = document.getElementById('matched-jobs');
  if (!matchedNames.length) {
    matchedEl.innerHTML = `<div class="no-match">
      <b>No matches found.</b> Try:<br>
      • Adding dates like "29/10" or "1 Nov" — the system is much sharper with dates<br>
      • Using more complete words (e.g. "chermside" instead of just "cherm")<br>
      • Pasting more surrounding context from the email
    </div>`;
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('output-section').style.display = 'none';
    return;
  }

  matchedEl.innerHTML = `<div class="matched-wrap">
    <div class="matched-label">Matched ${matchedNames.length} job name${matchedNames.length>1?'s':''} (no dates in email — showing all recent entries)</div>
    <div>${matchedNames.map((n, i) => `<span class="matched-badge" style="animation-delay:${i*0.04}s">${esc(n)}</span>`).join('')}</div>
  </div>`;

  const matchedJobs = allJobs.filter(j => matchedNames.includes(j.jobName));
  const filtered = filterByDate(matchedJobs, weeksRange);

  const grouped = {};
  filtered.forEach(j => {
    if (!grouped[j.jobName]) grouped[j.jobName] = [];
    grouped[j.jobName].push(j);
  });

  renderResults(grouped);
  renderOutput(grouped);
}

function renderDateAwareResults(matches) {
  const matchedEl = document.getElementById('matched-jobs');
  const found = matches.filter(m => m.jobName);
  const unmatched = matches.filter(m => !m.jobName);

  const fmtDate = (d) => d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
  const fmtDateLong = (d) => d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' });

  if (!found.length) {
    let html = `<div class="no-match">
      <b>Found ${matches.length} date${matches.length>1?'s':''} in your email but couldn't pin them to jobs.</b><br><br>
      ${matches.map(m => {
        if (m.reason === 'no_jobs_on_date') {
          return `• <b>${fmtDate(m.date)}</b> — no jobs recorded that day`;
        }
        return `• <b>${fmtDate(m.date)}</b> — searched for "${esc(m.searchText || '').slice(0,40)}" but nothing matched (jobs on that day: ${esc((m.candidates||[]).join(', '))})`;
      }).join('<br>')}
    </div>`;
    matchedEl.innerHTML = html;
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('output-section').style.display = 'none';
    return;
  }

  let html = `<div class="matched-wrap">
    <div class="matched-label">${found.length} date → job match${found.length>1?'es':''}</div>
    <div>${found.map((m, i) => `<span class="matched-badge" style="animation-delay:${i*0.04}s">${fmtDate(m.date)} → ${esc(m.jobName)}</span>`).join('')}</div>`;

  if (unmatched.length) {
    html += `<div style="margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,107,94,0.3);font-size:11px;color:var(--coral);">
      <b>Could not match:</b> ${unmatched.map(m => `${fmtDate(m.date)} (${m.reason === 'no_jobs_on_date' ? 'no jobs that day' : 'name not recognized'})`).join(' · ')}
    </div>`;
  }
  html += '</div>';
  matchedEl.innerHTML = html;

  // Render cards (one per date+job)
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = found.map((m, idx) => {
    const inheritedBadge = m.inherited
      ? `<span style="font-size:9px;background:rgba(251,191,36,0.15);color:var(--amber);padding:2px 7px;border-radius:8px;border:1px solid rgba(251,191,36,0.3);font-weight:600;letter-spacing:0.05em;margin-left:6px;">INHERITED</span>` : '';

    if (m.noDataOnDate) {
      return `<div class="job-card" style="animation-delay:${idx*0.06}s;opacity:0.7">
        <div class="job-title">
          ${esc(m.jobName)} ${inheritedBadge}
          <span class="job-title-count">${fmtDateLong(m.date)}</span>
        </div>
        <div class="job-entry" style="color:var(--coral);font-style:italic;">
          No entries recorded for this job on this date
        </div>
      </div>`;
    }

    const entriesHtml = m.entries.map(j => {
      const summary = entrySummaryLine(j);
      const extras = extrasLine(j);
      return `<div class="job-entry">
        <div style="color:#fff;font-weight:600;">${esc(summary)}</div>
        ${extras ? `<div class="entry-extras">${esc(extras)}</div>` : ''}
      </div>`;
    }).join('');

    return `<div class="job-card" style="animation-delay:${idx*0.06}s">
      <div class="job-title">
        ${esc(m.jobName)} ${inheritedBadge}
        <span class="job-title-count">${fmtDateLong(m.date)}</span>
      </div>
      ${entriesHtml}
    </div>`;
  }).join('');
  document.getElementById('results-section').style.display = 'block';

  // Formatted output
  const lines = [];
  found.forEach(m => {
    lines.push(m.jobName.toUpperCase());
    if (m.noDataOnDate) {
      lines.push(`  ${fmtDateLong(m.date)} · no entries recorded`);
    } else {
      m.entries.forEach(j => {
        let line = `  ${fmtDateLong(m.date)} · ${entrySummaryLine(j)}`;
        const extras = extrasLine(j);
        if (extras) line += '\n    ' + extras;
        lines.push(line);
      });
    }
    lines.push('');
  });
  document.getElementById('formatted-output').textContent = lines.join('\n').trim();
  document.getElementById('output-section').style.display = 'block';
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function groupTimeWindows(workers) {
  if (!workers.length) return { times: '', count: 0, peopleLabel: '' };
  // Collect unique time ranges (no counts shown)
  const unique = new Map();
  workers.forEach(w => {
    const key = w.from + '|' + w.to;
    if (!unique.has(key)) unique.set(key, { from: w.from, to: w.to });
  });
  const times = Array.from(unique.values())
    .sort((a,b) => a.from.localeCompare(b.from))
    .map(g => toTime12(g.from) + '–' + toTime12(g.to))
    .join(', ');
  const count = workers.length;
  const peopleLabel = count === 1 ? '1 person' : count + ' people';
  return { times, count, peopleLabel };
}

// Compose a single-line entry summary: "18.0hr · 12pm–6pm - 3 people"
function entrySummaryLine(j) {
  const tw = groupTimeWindows(j.workers);
  return `${j.totalHrs.toFixed(1)}hr · ${tw.times} - ${tw.peopleLabel}`;
}

function extrasLine(j) {
  const extras = [];
  if (j.parking > 0) extras.push('Parking $' + j.parking.toFixed(2));
  if (j.materials > 0) extras.push('Materials $' + j.materials.toFixed(2));
  return extras.length ? '+ ' + extras.join(' · ') : '';
}

function renderResults(grouped) {
  const el = document.getElementById('results');
  const keys = Object.keys(grouped);
  if (!keys.length) {
    el.innerHTML = '<div class="empty">No matching jobs found in the selected date range.<br>Try a wider range above.</div>';
    document.getElementById('results-section').style.display = 'block';
    document.getElementById('output-section').style.display = 'none';
    return;
  }
  el.innerHTML = keys.map((name, idx) => {
    const entries = grouped[name].sort((a,b) => {
      if (a.wk !== b.wk) return b.wk.localeCompare(a.wk);
      return DAYS.indexOf(b.day) - DAYS.indexOf(a.day);
    });
    const html = entries.map(j => {
      const date = formatJobDate(j.wk, j.day);
      const summary = entrySummaryLine(j);
      const extras = extrasLine(j);
      return `<div class="job-entry">
        <span class="entry-date">${esc(date)}</span>
        <span style="color:#fff;font-weight:600;">${esc(summary)}</span>
        ${extras ? `<div class="entry-extras">${esc(extras)}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="job-card" style="animation-delay:${idx*0.06}s">
      <div class="job-title">
        ${esc(name)}
        <span class="job-title-count">${entries.length} entr${entries.length>1?'ies':'y'}</span>
      </div>
      ${html}
    </div>`;
  }).join('');
  document.getElementById('results-section').style.display = 'block';
}

function renderOutput(grouped) {
  const keys = Object.keys(grouped);
  if (!keys.length) {
    document.getElementById('output-section').style.display = 'none';
    return;
  }
  const lines = [];
  keys.forEach(name => {
    const entries = grouped[name].sort((a,b) => {
      if (a.wk !== b.wk) return b.wk.localeCompare(a.wk);
      return DAYS.indexOf(b.day) - DAYS.indexOf(a.day);
    });
    lines.push(name.toUpperCase());
    entries.forEach(j => {
      const date = formatJobDate(j.wk, j.day);
      let line = `  ${date} · ${entrySummaryLine(j)}`;
      const extras = extrasLine(j);
      if (extras) line += '\n    ' + extras;
      lines.push(line);
    });
    lines.push('');
  });
  document.getElementById('formatted-output').textContent = lines.join('\n').trim();
  document.getElementById('output-section').style.display = 'block';
}

async function copyOutput() {
  const text = document.getElementById('formatted-output').textContent;
  try {
    await navigator.clipboard.writeText(text);
    showToast('✓ Copied to clipboard');
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ Copied');
  }
}

function clearAll() {
  document.getElementById('email-text').value = '';
  document.getElementById('matched-jobs').innerHTML = '';
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('output-section').style.display = 'none';
  document.getElementById('email-text').focus();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// Range tabs
document.querySelectorAll('.range-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.range-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    weeksRange = parseInt(tab.dataset.weeks);
    if (document.getElementById('email-text').value.trim()) lookup();
  });
});

// Keyboard shortcut: Ctrl/Cmd + Enter to trigger lookup
document.getElementById('email-text').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    lookup();
  }
});

window.addEventListener('DOMContentLoaded', async () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  await loadAllJobs();
});
</script>
</body>
</html>
