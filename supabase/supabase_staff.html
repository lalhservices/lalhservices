<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy-950: #060d1a;

    --navy-700: #1e3a63;

  .container {

    z-index: 1;

  .brand {

  .brand-logo {

  .brand-name {

    font-weight: 900;

  .brand-tagline {

    letter-spacing: 0.25em;

  .brand-role {

    color: var(--gold-400);

    border: 1px solid rgba(200,168,75,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.2em;
    font-weight: 600;

  .buttons {

    flex-direction: column;
    gap: 14px;
  }
  .btn {

    color: var(--white);
    display: block;
    position: relative;
    transition: all 0.2s ease;
  }
  .btn:hover {
    transform: translateY(-2px);

  /* Primary button — the dashboard */

  #pw-input {

    color: var(--white);

  #pw-input:focus {

    color: var(--navy-950);
    border: 0; padding: 14px 24px;

  }

  }
  #pw-error { color: #ff6b5e; font-size: 12px; margin-top: 12px; min-height: 16px; font-family: var(--mono); letter-spacing: 0.1em; }
</style>

<script>
(function(){
  const STORAGE_KEY = 'lalh_pw_unlocked_v1';
  const GRACE_MS = 15 * 60 * 1000;
  // Grace period: if authenticated within last 15 min, skip
  const t = parseInt(sessionStorage.getItem(STORAGE_KEY) || '0', 10);
  if (t > 0 && (Date.now() - t) < GRACE_MS) {
    const el = document.getElementById('pw-overlay');
    if (el) el.remove();
    sessionStorage.setItem(STORAGE_KEY, String(Date.now())); // extend
    return;
  }
  const PW_HASH = '785c05f974a8960b2990c2ef1597384587df82fb595b252c702af08570f0f968';
  async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  window.__pwCheck = async function() {
    const input = document.getElementById('pw-input');
    const err = document.getElementById('pw-error');
    const val = input.value.trim();
    if (!val) return;
    const hash = await sha256(val);
    if (hash === PW_HASH) {
      sessionStorage.setItem(STORAGE_KEY, String(Date.now()));
      document.getElementById('pw-overlay').remove();
    } else {
      err.textContent = '× Wrong password';
      input.value = ''; input.focus();
      setTimeout(() => err.textContent = '', 2500);
    }
  };
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('pw-input');
    if (input) {
      input.focus();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') window.__pwCheck(); });
    }
  });
})();
</script>
